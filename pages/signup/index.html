<head>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .page { display: block !important; }
  :root { --text: #ffffff; }
  .nav-logo, .nav-link, .nav-badge, .nav-drawer a,
  .topnav a, .nav-links a { text-decoration: none; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg, #0c0b10);
    padding-top: var(--nav-h, 68px);
  }

  .login-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(139,79,200,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,79,200,0.05) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .login-bg-orb {
    position: fixed; z-index: 0; pointer-events: none;
    width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(139,79,200,0.08) 0%, transparent 70%);
    top: -200px; left: 50%; transform: translateX(-50%);
  }

  .login-wrap {
    position: relative; z-index: 1;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .login-panel {
    width: 100%;
    max-width: 420px;
    background: var(--surface, #13121a);
    border: 1px solid var(--border, rgba(255,255,255,0.08));
    border-top: 2px solid var(--accent, #8b4fc8);
    padding: 48px 40px 40px;
    animation: pgIn 0.35s ease;
  }

  @keyframes pgIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .login-eyebrow {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
    color: var(--accent2, #b06ef5);
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .login-eyebrow::before {
    content: ''; display: block;
    width: 20px; height: 1px;
    background: var(--accent, #8b4fc8);
  }

  .login-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 32px; font-weight: 700; letter-spacing: 1px;
    color: var(--text-bright, #eeeef8);
    margin-bottom: 6px;
  }

  .login-sub {
    font-size: 13px; font-weight: 300;
    color: var(--text-dim, #6a6a8a);
    margin-bottom: 36px; line-height: 1.5;
  }

  .login-field { margin-bottom: 20px; }

  .login-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--text-dim, #6a6a8a);
    display: block; margin-bottom: 8px;
  }

  .login-input {
    width: 100%;
    background: var(--bg, #0c0b10);
    border: 1px solid var(--border, rgba(255,255,255,0.08));
    color: var(--text-bright, #eeeef8);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px; letter-spacing: 1px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .login-input:focus { border-color: var(--accent, #8b4fc8); }
  .login-input::placeholder { color: rgba(106,106,138,0.5); }
  .login-input.input-error { border-color: rgba(255,80,80,0.5); }

  /* Field hint */
  .login-hint {
    font-family: 'Share Tech Mono', monospace;
    font-size: 8px; letter-spacing: 1.5px;
    color: var(--text-dim, #6a6a8a);
    margin-top: 5px;
  }

  /* Password strength bar */
  .pw-strength-bar {
    height: 2px; width: 100%; margin-top: 6px;
    background: var(--border, rgba(255,255,255,0.08));
    position: relative; overflow: hidden;
  }
  .pw-strength-fill {
    height: 100%; width: 0%;
    transition: width 0.3s ease, background 0.3s ease;
  }

  #auth-error {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px;
    color: #ff5050;
    background: rgba(255,80,80,0.07);
    border: 1px solid rgba(255,80,80,0.2);
    border-left: 2px solid #ff5050;
    padding: 10px 14px;
    margin-bottom: 20px;
    display: block;
    transition: all 0.2s;
  }
  #auth-error:empty { display: none; }

  #auth-success {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px;
    color: var(--green, #00e87a);
    background: rgba(0,232,122,0.06);
    border: 1px solid rgba(0,232,122,0.2);
    border-left: 2px solid var(--green, #00e87a);
    padding: 10px 14px;
    margin-bottom: 20px;
    display: none;
  }

  .login-submit {
    width: 100%;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
    color: #fff;
    background: var(--accent, #8b4fc8);
    border: 1px solid var(--accent, #8b4fc8);
    padding: 14px;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
    margin-top: 8px;
  }
  .login-submit:hover:not(:disabled) {
    background: var(--accent2, #b06ef5);
    border-color: var(--accent2, #b06ef5);
  }
  .login-submit:disabled { opacity: 0.6; cursor: not-allowed; }

  .login-footer {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--border, rgba(255,255,255,0.08));
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap; gap: 10px;
  }
  .login-footer-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px;
    color: var(--text-dim, #6a6a8a);
    text-transform: uppercase;
  }
  .login-footer a {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--accent2, #b06ef5);
    text-decoration: none; transition: color 0.2s;
  }
  .login-footer a:hover { color: var(--text-bright, #eeeef8); }

  .login-back {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--text-dim, #6a6a8a);
    text-decoration: none;
    margin-bottom: 32px; transition: color 0.2s;
  }
  .login-back:hover { color: var(--text-bright, #eeeef8); }
  .login-back::before { content: '←'; }

  /* Terms */
  .login-terms {
    font-family: 'Share Tech Mono', monospace;
    font-size: 8px; letter-spacing: 1.5px;
    color: var(--text-dim, #6a6a8a);
    margin-top: 16px; line-height: 1.7; text-align: center;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://bbyiezjvonacajigqoik.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_cINDYla6QRiEpRWunZVFqQ_E5q2LqHb';
  const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Redirect if already logged in
  async function checkSession() {
    const { data: { session } } = await _sb.auth.getSession();
    if (session) window.location.href = '/';
  }

  // Password strength indicator
  function checkPasswordStrength(pw) {
    const fill = document.getElementById('pw-fill');
    if (!fill) return;
    let score = 0;
    if (pw.length >= 8)  score++;
    if (pw.length >= 12) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    const pct   = (score / 5) * 100;
    const color = score <= 1 ? '#ff5050' : score <= 3 ? '#f5a623' : '#00e87a';
    fill.style.width = pct + '%';
    fill.style.background = color;
  }

  async function handleSignup(e) {
    e.preventDefault();

    const email    = document.getElementById('email').value.trim();
    const username = document.getElementById('username').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;

    const errEl  = document.getElementById('auth-error');
    const sucEl  = document.getElementById('auth-success');
    const btn    = document.getElementById('submit-btn');

    errEl.textContent = '';
    sucEl.style.display = 'none';

    // ── Client-side validation ──
    if (username.length < 3) {
      errEl.textContent = 'Username must be at least 3 characters.'; return;
    }
    if (!/^[a-z0-9_]+$/.test(username)) {
      errEl.textContent = 'Username can only contain letters, numbers and underscores.'; return;
    }
    if (password.length < 8) {
      errEl.textContent = 'Password must be at least 8 characters.'; return;
    }
    if (password !== confirm) {
      errEl.textContent = 'Passwords do not match.'; return;
    }

    btn.textContent = 'CREATING ACCOUNT...';
    btn.disabled = true;

    // ── Check username not taken ──
    const { data: existing } = await _sb
      .from('profiles')
      .select('id')
      .eq('username', username)
      .maybeSingle();

    if (existing) {
      errEl.textContent = 'Username already taken. Please choose another.';
      btn.textContent = 'Create Account →'; btn.disabled = false; return;
    }

    // ── Create auth user ──
    const { data: authData, error: signupError } = await _sb.auth.signUp({
      email,
      password,
      options: { data: { username } }
    });

    if (signupError) {
      errEl.textContent = signupError.message;
      btn.textContent = 'Create Account →'; btn.disabled = false; return;
    }

    // Profile row is auto-created by the on_auth_user_created trigger in Supabase

    // ── Success ──
    btn.textContent = 'ACCOUNT CREATED ✓';
    const needsConfirm = !authData.session;
    sucEl.textContent = needsConfirm
      ? 'Account created! Check your email to confirm, then log in.'
      : 'Account created! Redirecting to login...';
    sucEl.style.display = 'block';
    setTimeout(() => window.location.href = '/pages/login', 3000);
  }

  document.addEventListener('DOMContentLoaded', checkSession);
</script>
<script src="/assets/js/status.js"></script>
<script src="/assets/js/nav.js"></script>
<script src="/assets/js/nav-auth.js"></script>
</head>
<body>

<div class="login-bg"></div>
<div class="login-bg-orb"></div>

<div id="nav-root"></div>

<div class="login-wrap">
  <div class="login-panel">
    <a class="login-back" href="/pages/login">Back to Log In</a>

    <div class="login-eyebrow">New Account</div>
    <div class="login-title">Sign Up</div>
    <div class="login-sub">Create a free account for Script Library access and commission tracking.</div>

    <span id="auth-error"></span>
    <div id="auth-success"></div>

    <form onsubmit="handleSignup(event)">
      <div class="login-field">
        <label class="login-label" for="email">Email</label>
        <input class="login-input" type="email" id="email"
          placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="login-field">
        <label class="login-label" for="username">Username</label>
        <input class="login-input" type="text" id="username"
          placeholder="yourhandle" required autocomplete="username"
          maxlength="32" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9_]/g,'')">
        <div class="login-hint">Letters, numbers and underscores only</div>
      </div>

      <div class="login-field">
        <label class="login-label" for="password">Password</label>
        <input class="login-input" type="password" id="password"
          placeholder="••••••••" required autocomplete="new-password"
          oninput="checkPasswordStrength(this.value)">
        <div class="pw-strength-bar"><div class="pw-strength-fill" id="pw-fill"></div></div>
      </div>

      <div class="login-field">
        <label class="login-label" for="confirm">Confirm Password</label>
        <input class="login-input" type="password" id="confirm"
          placeholder="••••••••" required autocomplete="new-password">
      </div>

      <button class="login-submit" type="submit" id="submit-btn">Create Account →</button>

      <div class="login-terms">
        By creating an account you agree to our terms of service.<br>
        Your email is used for login only and never shared.
      </div>
    </form>

    <div class="login-footer">
      <span class="login-footer-text">Already have an account?</span>
      <a href="/pages/login">Log In →</a>
    </div>
  </div>
</div>

</body>
</html>
