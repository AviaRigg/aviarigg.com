<style>
  #nav-auth-container { display: flex; align-items: center; }
  .nav-auth-link {
    font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--accent2, #b06ef5); background: transparent;
    border: 1px solid rgba(139,79,200,0.4); padding: 7px 16px;
    cursor: pointer; transition: all 0.2s; text-decoration: none;
  }
  .nav-auth-link:hover { border-color: var(--accent2, #b06ef5); }
  .nav-user-wrap { position: relative; }
  .nav-user-btn {
    font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--accent2, #b06ef5); background: transparent;
    border: 1px solid rgba(139,79,200,0.4); padding: 7px 14px;
    cursor: pointer; display: flex; align-items: center; gap: 8px;
  }
  .nav-user-btn:hover { border-color: var(--accent2, #b06ef5); background: rgba(139,79,200,0.08); }
  .nav-user-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green, #00e87a); flex-shrink: 0; animation: blink 2.5s ease-in-out infinite; }
  .nav-user-caret { font-size: 9px; opacity: 0.6; }
  .nav-user-dropdown {
    display: none; position: absolute; top: calc(100% + 8px); right: 0; min-width: 180px;
    background: var(--surface, #13121a); border: 1px solid var(--border, rgba(255,255,255,0.08));
    border-top: 2px solid var(--accent, #8b4fc8); z-index: 9999; flex-direction: column;
  }
  .nav-user-dropdown.open { display: flex; }
  .nav-user-email {
    font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: 1px;
    color: var(--text-dim, #6a6a8a); padding: 10px 14px 8px;
    border-bottom: 1px solid var(--border, rgba(255,255,255,0.08));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nav-dropdown-item {
    font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text, #ccc); background: none; border: none; padding: 10px 14px;
    cursor: pointer; text-align: left; text-decoration: none; display: block;
    border-bottom: 1px solid var(--border, rgba(255,255,255,0.05)); transition: background 0.15s, color 0.15s;
  }
  .nav-dropdown-item:last-child { border-bottom: none; }
  .nav-dropdown-item:hover { background: rgba(139,79,200,0.08); color: var(--text-bright, #eeeef8); }
  .nav-dropdown-danger { color: #ff5050 !important; }
  .nav-dropdown-danger:hover { background: rgba(255,80,80,0.08) !important; }
</style>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .page { display: block !important; }
  :root { --text: #ffffff; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg, #0c0b10);
  }

  /* ── GRID BACKGROUND ── */
  .login-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(139,79,200,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,79,200,0.05) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .login-bg-orb {
    position: fixed; z-index: 0; pointer-events: none;
    width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(139,79,200,0.08) 0%, transparent 70%);
    top: -200px; left: 50%; transform: translateX(-50%);
  }

  /* ── MAIN LAYOUT ── */
  .login-wrap {
    position: relative; z-index: 1;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .login-panel {
    width: 100%;
    max-width: 420px;
    background: var(--surface, #13121a);
    border: 1px solid var(--border, rgba(255,255,255,0.08));
    border-top: 2px solid var(--accent, #8b4fc8);
    padding: 48px 40px 40px;
    animation: pgIn 0.35s ease;
  }

  @keyframes pgIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── HEADER ── */
  .login-eyebrow {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent2, #b06ef5);
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .login-eyebrow::before {
    content: ''; display: block;
    width: 20px; height: 1px;
    background: var(--accent, #8b4fc8);
  }

  .login-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 32px; font-weight: 700; letter-spacing: 1px;
    color: var(--text-bright, #eeeef8);
    margin-bottom: 6px;
  }

  .login-sub {
    font-size: 13px; font-weight: 300;
    color: var(--text-dim, #6a6a8a);
    margin-bottom: 36px;
    line-height: 1.5;
  }

  /* ── FORM ── */
  .login-field {
    margin-bottom: 20px;
  }

  .login-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--text-dim, #6a6a8a);
    display: block; margin-bottom: 8px;
  }

  .login-input {
    width: 100%;
    background: var(--bg, #0c0b10);
    border: 1px solid var(--border, rgba(255,255,255,0.08));
    color: var(--text-bright, #eeeef8);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px; letter-spacing: 1px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .login-input:focus {
    border-color: var(--accent, #8b4fc8);
  }
  .login-input::placeholder {
    color: rgba(106,106,138,0.5);
  }

  /* ── ERROR ── */
  #auth-error {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px;
    color: #ff5050;
    background: rgba(255,80,80,0.07);
    border: 1px solid rgba(255,80,80,0.2);
    border-left: 2px solid #ff5050;
    padding: 10px 14px;
    margin-bottom: 20px;
    display: block;
    min-height: 0;
    transition: all 0.2s;
  }
  #auth-error:empty { display: none; }

  /* ── SUBMIT ── */
  .login-submit {
    width: 100%;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
    color: #fff;
    background: var(--accent, #8b4fc8);
    border: 1px solid var(--accent, #8b4fc8);
    padding: 14px;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
    margin-top: 8px;
  }
  .login-submit:hover:not(:disabled) {
    background: var(--accent2, #b06ef5);
    border-color: var(--accent2, #b06ef5);
  }
  .login-submit:disabled {
    opacity: 0.6; cursor: not-allowed;
  }

  /* ── FOOTER LINKS ── */
  .login-footer {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--border, rgba(255,255,255,0.08));
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .login-footer-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px;
    color: var(--text-dim, #6a6a8a);
    text-transform: uppercase;
  }
  .login-footer a {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--accent2, #b06ef5);
    text-decoration: none;
    transition: color 0.2s;
  }
  .login-footer a:hover { color: var(--text-bright, #eeeef8); }

  /* ── BACK LINK ── */
  .login-back {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--text-dim, #6a6a8a);
    text-decoration: none;
    margin-bottom: 32px;
    transition: color 0.2s;
  }
  .login-back:hover { color: var(--text-bright, #eeeef8); }
  .login-back::before { content: '←'; }
</style>
