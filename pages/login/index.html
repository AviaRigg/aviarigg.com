<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — AviaRigg</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/png" href="/assets/icons/SiteIcon.png">
<link rel="shortcut icon" href="/assets/icons/SiteIcon.png">
<link rel="apple-touch-icon" href="/assets/icons/SiteIcon.png">

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://bbyiezjvonacajigqoik.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_cINDYla6QRiEpRWunZVFqQ_E5q2LqHb';
  const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // If already logged in, redirect away
  async function checkSession() {
    const { data: { session } } = await _sb.auth.getSession();
    if (session) window.location.href = '/';
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('auth-error');
    const btn = document.getElementById('submit-btn');

    errEl.textContent = '';
    btn.textContent = 'AUTHENTICATING...';
    btn.disabled = true;

    const { error } = await _sb.auth.signInWithPassword({ email, password });

    if (error) {
      errEl.textContent = error.message;
      btn.textContent = 'LOG IN';
      btn.disabled = false;
    } else {
      btn.textContent = 'ACCESS GRANTED ✓';
      // Redirect to where they came from, or home
      const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
      setTimeout(() => window.location.href = redirect, 600);
    }
  }

  document.addEventListener('DOMContentLoaded', checkSession);
</script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .page { display: block !important; }
  :root { --text: #ffffff; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg, #0c0b10);
  }

  /* ── GRID BACKGROUND ── */
  .login-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(139,79,200,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,79,200,0.05) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .login-bg-orb {
    position: fixed; z-index: 0; pointer-events: none;
    width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(139,79,200,0.08) 0%, transparent 70%);
    top: -200px; left: 50%; transform: translateX(-50%);
  }

  /* ── MAIN LAYOUT ── */
  .login-wrap {
    position: relative; z-index: 1;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .login-panel {
    width: 100%;
    max-width: 420px;
    background: var(--surface, #13121a);
    border: 1px solid var(--border, rgba(255,255,255,0.08));
    border-top: 2px solid var(--accent, #8b4fc8);
    padding: 48px 40px 40px;
    animation: pgIn 0.35s ease;
  }

  @keyframes pgIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── HEADER ── */
  .login-eyebrow {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent2, #b06ef5);
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .login-eyebrow::before {
    content: ''; display: block;
    width: 20px; height: 1px;
    background: var(--accent, #8b4fc8);
  }

  .login-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 32px; font-weight: 700; letter-spacing: 1px;
    color: var(--text-bright, #eeeef8);
    margin-bottom: 6px;
  }

  .login-sub {
    font-size: 13px; font-weight: 300;
    color: var(--text-dim, #6a6a8a);
    margin-bottom: 36px;
    line-height: 1.5;
  }

  /* ── FORM ── */
  .login-field {
    margin-bottom: 20px;
  }

  .login-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--text-dim, #6a6a8a);
    display: block; margin-bottom: 8px;
  }

  .login-input {
    width: 100%;
    background: var(--bg, #0c0b10);
    border: 1px solid var(--border, rgba(255,255,255,0.08));
    color: var(--text-bright, #eeeef8);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px; letter-spacing: 1px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .login-input:focus {
    border-color: var(--accent, #8b4fc8);
  }
  .login-input::placeholder {
    color: rgba(106,106,138,0.5);
  }

  /* ── ERROR ── */
  #auth-error {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px;
    color: #ff5050;
    background: rgba(255,80,80,0.07);
    border: 1px solid rgba(255,80,80,0.2);
    border-left: 2px solid #ff5050;
    padding: 10px 14px;
    margin-bottom: 20px;
    display: block;
    min-height: 0;
    transition: all 0.2s;
  }
  #auth-error:empty { display: none; }

  /* ── SUBMIT ── */
  .login-submit {
    width: 100%;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
    color: #fff;
    background: var(--accent, #8b4fc8);
    border: 1px solid var(--accent, #8b4fc8);
    padding: 14px;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
    margin-top: 8px;
  }
  .login-submit:hover:not(:disabled) {
    background: var(--accent2, #b06ef5);
    border-color: var(--accent2, #b06ef5);
  }
  .login-submit:disabled {
    opacity: 0.6; cursor: not-allowed;
  }

  /* ── FOOTER LINKS ── */
  .login-footer {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--border, rgba(255,255,255,0.08));
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .login-footer-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px;
    color: var(--text-dim, #6a6a8a);
    text-transform: uppercase;
  }
  .login-footer a {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--accent2, #b06ef5);
    text-decoration: none;
    transition: color 0.2s;
  }
  .login-footer a:hover { color: var(--text-bright, #eeeef8); }

  /* ── BACK LINK ── */
  .login-back {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--text-dim, #6a6a8a);
    text-decoration: none;
    margin-bottom: 32px;
    transition: color 0.2s;
  }
  .login-back:hover { color: var(--text-bright, #eeeef8); }
  .login-back::before { content: '←'; }
</style>
</head>
<body>

<div class="login-bg"></div>
<div class="login-bg-orb"></div>

<nav class="topnav">
  <a class="nav-logo" href="/"><img src="/assets/icons/SiteIcon.png" alt="AviaRigg Logo" style="height:clamp(24px,2.2vw,36px);width:auto;display:inline-block;vertical-align:middle;margin-right:clamp(8px,0.8vw,14px);"><span style="display:inline-block;width:1px;height:clamp(18px,1.6vw,26px);background:rgba(139,79,200,0.4);vertical-align:middle;margin-right:clamp(8px,0.8vw,14px);"></span>Avia<span>Rigg</span></a>
  <div class="nav-links">
    <a class="nav-link" href="/">Home</a>
    <a class="nav-link" href="/pages/portfolio">Portfolio</a>
    <a class="nav-link" href="/pages/library">Script Library</a>
    <a class="nav-link" href="/pages/shop">Shop</a>
    <a class="nav-link" href="/pages/about">About</a>
    <a class="nav-link" href="/pages/contact">Contact</a>
  </div>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu" onclick="toggleMobileNav()">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="nav-drawer" id="nav-drawer">
  <a class="nav-link" href="/">Home</a>
  <a class="nav-link" href="/pages/portfolio">Portfolio</a>
  <a class="nav-link" href="/pages/shop">Shop</a>
  <a class="nav-link" href="/pages/about">About</a>
  <a class="nav-link" href="/pages/contact">Contact</a>
</div>

<div class="login-wrap">
  <div class="login-panel">
    <a class="login-back" href="/">Back to site</a>

    <div class="login-eyebrow">Access Portal</div>
    <div class="login-title">Log In</div>
    <div class="login-sub">Script Library access and commission tracking for registered users.</div>

    <span id="auth-error"></span>

    <form onsubmit="handleLogin(event)">
      <div class="login-field">
        <label class="login-label" for="email">Email Address</label>
        <input class="login-input" type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="login-field">
        <label class="login-label" for="password">Password</label>
        <input class="login-input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button class="login-submit" type="submit" id="submit-btn">Log In →</button>
    </form>

    <div class="login-footer">
      <span class="login-footer-text">No account?</span>
      <a href="/pages/signup">Create free account →</a>
    </div>
  </div>
</div>

<script>
function toggleMobileNav() {
  const drawer = document.getElementById('nav-drawer');
  const btn = document.getElementById('nav-hamburger');
  const isOpen = drawer.classList.contains('open');
  drawer.classList.toggle('open', !isOpen);
  btn.classList.toggle('open', !isOpen);
}
</script>
</body>
</html>
